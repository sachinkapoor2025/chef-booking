<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Maharaja Chef Services</title>
    <meta name="description" content="Login to your Maharaja Chef Services account to book chefs or manage your chef profile.">
    <meta name="keywords" content="login, chef services, personal chef, account access">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<main>

<!-- ================= LOGIN FORM SECTION ================= -->

<section id="login-form" style="max-width: 800px; margin: 4rem auto; padding: 2rem 1rem;">
    <div style="background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08);">

        <!-- Tabs -->
        <div style="display: flex; margin-bottom: 2rem; border-bottom: 1px solid #e5e7eb;">
            <button id="customer-tab" class="tab-button active"
                style="flex:1;padding:1rem;background:transparent;border:none;font-size:1.1rem;font-weight:600;color:#3b82f6;border-bottom:3px solid #3b82f6;cursor:pointer;">
                <i class="fas fa-user"></i> Customer
            </button>

            <button id="chef-tab" class="tab-button"
                style="flex:1;padding:1rem;background:transparent;border:none;font-size:1.1rem;font-weight:600;color:#6b7280;cursor:pointer;">
                <i class="fas fa-user-chef"></i> Chef
            </button>
        </div>

        <!-- ================= CUSTOMER LOGIN ================= -->

        <form id="customer-login-form">

            <div style="margin-bottom:1.5rem;">
                <label>Email Address</label>
                <input type="email" id="customer-email" required
                    style="width:100%;padding:0.875rem;border:1px solid #d1d5db;border-radius:8px;">
            </div>

            <div style="margin-bottom:1.5rem;">
                <label>Password</label>
                <div style="position:relative;">
                    <input type="password" id="customer-password" required
                        style="width:100%;padding:0.875rem;border:1px solid #d1d5db;border-radius:8px;">
                    <i class="fas fa-eye-slash" id="toggle-password"
                        style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);cursor:pointer;"></i>
                </div>
            </div>

            <button type="submit" class="btn"
                style="width:100%;padding:1rem;font-size:1.1rem;">
                <i class="fas fa-sign-in-alt"></i> Log In as Customer
            </button>

        </form>

        <!-- ================= CHEF LOGIN (UNCHANGED) ================= -->

        <form id="chef-login-form" style="display:none;">

            <div style="margin-bottom:1.5rem;">
                <label>Chef Email</label>
                <input type="email" id="chef-email" required
                    style="width:100%;padding:0.875rem;border:1px solid #d1d5db;border-radius:8px;">
            </div>

            <div style="margin-bottom:1.5rem;">
                <label>Password</label>
                <div style="position:relative;">
                    <input type="password" id="chef-password" required
                        style="width:100%;padding:0.875rem;border:1px solid #d1d5db;border-radius:8px;">
                    <i class="fas fa-eye-slash" id="toggle-chef-password"
                        style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);cursor:pointer;"></i>
                </div>
            </div>

            <button type="submit" class="btn"
                style="width:100%;padding:1rem;font-size:1.1rem;background:linear-gradient(135deg,#10b981,#059669);">
                <i class="fas fa-sign-in-alt"></i> Log In as Chef
            </button>

        </form>

    </div>
</section>

</main>

<script>

document.addEventListener('DOMContentLoaded', function() {

    const apiGatewayUrl = 'https://fated6vcp8.execute-api.us-east-1.amazonaws.com/prod';

    const customerTab = document.getElementById('customer-tab');
    const chefTab = document.getElementById('chef-tab');
    const customerForm = document.getElementById('customer-login-form');
    const chefForm = document.getElementById('chef-login-form');

    /* ================= TAB SWITCH ================= */

    customerTab.addEventListener('click', function() {
        customerForm.style.display = 'block';
        chefForm.style.display = 'none';
        customerTab.style.borderBottom = '3px solid #3b82f6';
        chefTab.style.borderBottom = 'none';
        customerTab.style.color = '#3b82f6';
        chefTab.style.color = '#6b7280';
    });

    chefTab.addEventListener('click', function() {
        chefForm.style.display = 'block';
        customerForm.style.display = 'none';
        chefTab.style.borderBottom = '3px solid #10b981';
        customerTab.style.borderBottom = 'none';
        chefTab.style.color = '#10b981';
        customerTab.style.color = '#6b7280';
    });

    /* ================= PASSWORD TOGGLE ================= */

    document.getElementById('toggle-password').addEventListener('click', function() {
        const input = document.getElementById('customer-password');
        input.type = input.type === 'password' ? 'text' : 'password';
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    document.getElementById('toggle-chef-password').addEventListener('click', function() {
        const input = document.getElementById('chef-password');
        input.type = input.type === 'password' ? 'text' : 'password';
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    /* ================= CUSTOMER LOGIN API ================= */

    customerForm.addEventListener('submit', async function(e) {

        e.preventDefault();

        const email = document.getElementById('customer-email').value.trim();
        const password = document.getElementById('customer-password').value.trim();

        if (!email || !password) {
            alert('Please enter email and password');
            return;
        }

        const btn = customerForm.querySelector('button');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging In...';

        try {

            const response = await fetch(`${apiGatewayUrl}/diet-plan/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const result = await response.json();

            if (response.ok) {

                localStorage.setItem('customerSession', JSON.stringify({
                    userId: result.userId,
                    email: email,
                    fullName: result.fullName
                }));

                window.location.href = 'customer-dashboard.html';

            } else {
                alert(result.error || 'Invalid login');
            }

        } catch (err) {
            alert('Server error. Try again.');
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Log In as Customer';

    });

    /* ================= CHEF LOGIN (UNCHANGED) ================= */

    chefForm.addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Chef login mechanism remains unchanged.');
    });

});

</script>

</body>
</html>
