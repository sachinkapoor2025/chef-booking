AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Backend infrastructure for Chef Services website with API Gateway, Lambda, and DynamoDB

Parameters:
  StackName:
    Type: String
    Default: chef-services-backend
    Description: Name of the CloudFormation stack

Resources:
  # DynamoDB Tables
  AdminCredentialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-admin-credentials"
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-submissions"
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: formType
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: formType
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: formType-index
          KeySchema:
            - AttributeName: formType
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  WeeklySubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-weekly-submissions"
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: formType
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: formType
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: formType-index
          KeySchema:
            - AttributeName: formType
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  ChefTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-chefs"
      AttributeDefinitions:
        - AttributeName: chefId
          AttributeType: S
      KeySchema:
        - AttributeName: chefId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # Chat History Table for multi-language chatbot
  ChatHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-chat-history"
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # User Table for diet plan feature
  DietPlanUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-diet-plan-users"
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  # Diet Plans Table for storing generated diet plans
  DietPlansTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: !Sub "${AWS::StackName}-diet-plans"
        AttributeDefinitions:
          - AttributeName: planId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
          - AttributeName: email
            AttributeType: S   # ✅ NEW

        KeySchema:
          - AttributeName: planId
            KeyType: HASH

        GlobalSecondaryIndexes:
          # Existing index (keep this)
          - IndexName: user-plans-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          # ✅ NEW INDEX (critical)
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        BillingMode: PAY_PER_REQUEST

  # Lambda Functions 
  FormSubmissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-form-submission"
      CodeUri: src/
      Handler: form_submission.handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          SUBMISSIONS_TABLE: !Ref SubmissionsTable
          WEEKLY_SUBMISSIONS_TABLE: !Ref WeeklySubmissionsTable
          ADMIN_CREDENTIALS_TABLE: !Ref AdminCredentialsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeeklySubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AdminCredentialsTable
        - AmazonSESFullAccess
      Events:
        SubmitForm:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /submit
            Method: post

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin"
      CodeUri: src/
      Handler: admin.handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          SUBMISSIONS_TABLE: !Ref SubmissionsTable
          WEEKLY_SUBMISSIONS_TABLE: !Ref WeeklySubmissionsTable
          CHEF_TABLE: !Ref ChefTable
          ADMIN_CREDENTIALS_TABLE: !Ref AdminCredentialsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeeklySubmissionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ChefTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AdminCredentialsTable
      Events:
        AdminLogin:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/login
            Method: post
        AdminData:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/data/{formType}
            Method: get
        AdminChefs:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/chefs
            Method: get
        AdminAddChef:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/chefs
            Method: post
        AdminWeeklyData:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/weekly-data
            Method: get
        PublicChefs:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /chefs
            Method: get

  BeautifyChefFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-beautify-chef"
      CodeUri: src/
      Handler: beautify_chef.handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          CHEF_TABLE: !Ref ChefTable
          OPENAI_API_KEY: !Sub "{{resolve:secretsmanager:arn:aws:secretsmanager:us-east-1:985539754737:secret:maharajachef-6whRGm:SecretString:openai_api_key}}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ChefTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: "arn:aws:secretsmanager:us-east-1:985539754737:secret:maharajachef-6whRGm"
      Events:
        BeautifyChef:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/beautify-chef
            Method: post

  # Multi-language Chatbot Function
  ChatbotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-chatbot"
      CodeUri: src/
      Handler: chatbot.handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          CHAT_HISTORY_TABLE: !Ref ChatHistoryTable
          OPENAI_API_KEY: !Sub "{{resolve:secretsmanager:arn:aws:secretsmanager:us-east-1:985539754737:secret:maharajachef-6whRGm:SecretString:openai_api_key}}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatHistoryTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: "arn:aws:secretsmanager:us-east-1:985539754737:secret:maharajachef-6whRGm"
      Events:
        Chat:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /chat
            Method: post
        ChatHistory:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /chat/history
            Method: get

  # Diet Plan Function
  DietPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-diet-plan"
      CodeUri: src/
      Handler: diet_plan.handler
      Runtime: python3.12
      Timeout: 300          # ✅ 5 minutes
      MemorySize: 1024     # ✅ 1 GB RAM (recommended for OpenAI + JSON + PDF)
      Environment:
        Variables:
          DIET_PLAN_USERS_TABLE: !Ref DietPlanUsersTable
          DIET_PLANS_TABLE: !Ref DietPlansTable
          OPENAI_API_KEY: !Sub "{{resolve:secretsmanager:arn:aws:secretsmanager:us-east-1:985539754737:secret:maharajachef-6whRGm:SecretString:openai_api_key}}"
          S3_BUCKET: maharaja-chef-diet-plans
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DietPlanUsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DietPlansTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: "arn:aws:secretsmanager:us-east-1:985539754737:secret:maharajachef-6whRGm"
        - AmazonS3FullAccess
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt DietPlanWorkerFunction.Arn
      Events:
        GenerateDietPlan:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /diet-plan/generate
            Method: post
        UserSignup:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /diet-plan/signup
            Method: post
        UserLogin:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /diet-plan/login
            Method: post
        GetUserPlans:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /diet-plan/user/{userId}/plans
            Method: get
        AssociatePlanWithUser:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /diet-plan/user/{userId}/plans
            Method: put
        GetDietPlan:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /diet-plan/{planId}
            Method: get
        DownloadDietPlan:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /diet-plan/{planId}/download
            Method: get

  # Chef Application Table
  ChefApplicationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-chef-applications"
      AttributeDefinitions:
        - AttributeName: applicationId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S
      KeySchema:
        - AttributeName: applicationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: submittedAt-index
          KeySchema:
            - AttributeName: submittedAt
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  # Blog Submissions Table
  BlogSubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-blog-submissions"
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: formType
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: formType
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: submittedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: formType-index
          KeySchema:
            - AttributeName: formType
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  # Blog Submissions S3 Bucket
  BlogSubmissionsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-blog-submissions"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # Blog Submission Function
  BlogSubmissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-blog-submission"
      CodeUri: src/
      Handler: blog_submission.lambda_handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          SUBMISSIONS_TABLE: !Ref BlogSubmissionsTable
          BLOGS_BUCKET: !Ref BlogSubmissionsBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogSubmissionsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::${BlogSubmissionsBucket}/*"
      Events:
        SubmitBlog:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /blog-submission
            Method: post
        GetPendingBlogs:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /blog-submission/pending
            Method: get
        ApproveBlog:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /blog-submission/{submissionId}/approve
            Method: put
        RejectBlog:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /blog-submission/{submissionId}/reject
            Method: put

  # Chef Application Function
  ChefApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-chef-application"
      CodeUri: src/
      Handler: chef_application.lambda_handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          CHEF_APPLICATION_TABLE: !Ref ChefApplicationTable
          CHEF_APPLICATION_BUCKET: maharaja-chef-applications
          FROM_EMAIL: noreply@maharajachef.com
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChefApplicationTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::maharaja-chef-applications/*"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        SubmitChefApplication:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /chef-application
            Method: post
        ChefApplicationHealth:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /chef-application/health
            Method: get

  # Catering Submission Function
  CateringSubmissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-catering-submission"
      CodeUri: src/
      Handler: catering_submission.lambda_handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          SUBMISSIONS_TABLE: !Ref SubmissionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
      Events:
        SubmitCatering:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /catering-submission
            Method: post

  # Diet Plan Worker Function (Background Processing)
  DietPlanWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-diet-plan-worker"
      CodeUri: src/
      Handler: diet_plan_worker.handler
      Runtime: python3.12
      Timeout: 900          # 15 minutes for OpenAI processing
      MemorySize: 1024     # 1 GB RAM
      Environment:
        Variables:
          DIET_PLAN_USERS_TABLE: !Ref DietPlanUsersTable
          DIET_PLANS_TABLE: !Ref DietPlansTable
          OPENAI_API_KEY: !Sub "{{resolve:secretsmanager:arn:aws:secretsmanager:us-east-1:985539754737:secret:maharajachef-6whRGm:SecretString:openai_api_key}}"
          S3_BUCKET: maharaja-chef-diet-plans
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DietPlanUsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DietPlansTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: "arn:aws:secretsmanager:us-east-1:985539754737:secret:maharajachef-6whRGm"
        - AmazonS3FullAccess

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: prod
      Cors:
        AllowMethods: "'POST,GET,OPTIONS,PUT'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${AWS::StackName}-api-url"
